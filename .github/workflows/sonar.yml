name: SonarCloud Analysis

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# En PR se cancela la ejecución anterior; en push a main nunca (la promoción a deploy
# exige un análisis completo por commit).
concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: svaes
          POSTGRES_PASSWORD: svaes
          POSTGRES_DB: svaes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          version: "0.13.6"
          enable-cache: true

      - name: Run unit tests
        run: uv run --frozen --no-build --project api --extra dev pytest tests/unit --cov=api/src --cov-report=

      - name: Run acceptance structure tests
        run: uv run --frozen --no-build --project api --extra dev pytest tests/acceptance/test_acceptance_structure.py -v --tb=short

      - name: Run integration and security tests
        env:
          DATABASE_URL: postgresql+asyncpg://svaes:svaes@localhost:5432/svaes_test
          JWT_SECRET_KEY: ci-test-secret-key-not-used-in-production
          JWT_ALGORITHM: HS256
          JWT_EXPIRE_MINUTES: "30"
          ALLOWED_ORIGINS: "http://localhost"
          ENVIRONMENT: test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          ENGINE_URL: http://localhost:8081
          ENGINE_API_KEY: ci-test-key
          ADMIN_EMAIL: admin@test.local
          ADMIN_PASSWORD: test-password-not-for-production
          ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          API_KEY_PEPPER: ci-test-api-key-pepper-not-for-production
          TEST_POSTGRES_USER: svaes
          TEST_POSTGRES_PASSWORD: svaes
          TEST_POSTGRES_HOST: localhost
          TEST_POSTGRES_PORT: "5432"
          TEST_POSTGRES_DB: svaes_test
          POSTGRES_PASSWORD: svaes
        run: uv run --frozen --no-build --project api --extra dev pytest tests/integration tests/security --cov=api/src --cov-append --cov-report=xml

      - name: Run performance structure and RNF tests
        run: uv run --frozen --no-build --project api --extra dev pytest tests/performance/test_coverage_threshold.py tests/performance/test_rnf_coverage.py tests/performance/test_rnf_security_rf.py -v --tb=short

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.0.0
        with:
          version: "10"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run frontend Angular/Vitest tests
        working-directory: web
        run: pnpm exec ng test --watch=false --configuration=ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: llvm-tools-preview

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            engine/target
          key: cargo-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: cargo-llvm-cov

      - name: Run Rust engine coverage
        working-directory: engine
        run: cargo llvm-cov --lcov --output-path lcov.info --ignore-filename-regex "main\.rs$"

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
