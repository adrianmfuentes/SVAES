name: Deploy to Server

on:
  push:
    branches:
      - deploy
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      force_rebuild:
        description: 'Force rebuild of Docker images'
        required: false
        default: false
        type: boolean
      skip_migration:
        description: 'Skip database migration'
        required: false
        default: false
        type: boolean
      clean_volumes:
        description: 'Delete ALL SVAES data volumes (postgres + redis). DESTRUCTIVE — irreversible.'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-to-server
  queue: max

env:
  DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'production' }}
  REGISTRY: ghcr.io
  API_IMAGE: ${{ github.repository_owner }}/svaes-api
  WEB_IMAGE: ${{ github.repository_owner }}/svaes-web
  ENGINE_IMAGE: ${{ github.repository_owner }}/svaes-engine

jobs:
  check-sonar-status:
    name: Check Sonar workflow status
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/validate-deploy.yml

  build-and-push:
    needs: check-sonar-status
    name: Build and Push Images
    runs-on: [self-hosted, ARM64, oracle-ampere]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      api_tag: ${{ steps.meta-api.outputs.version }}
      web_tag: ${{ steps.meta-web.outputs.version }}
      engine_tag: ${{ steps.meta-engine.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE }}
          tags: |
            type=sha,prefix={{branch}}-,format=short
            type=sha,prefix=sha-,format=long
            type=raw,value=latest

      - name: Build and push API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          no-cache: ${{ inputs.force_rebuild == true }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Web
        id: meta-web
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}
          tags: |
            type=sha,prefix={{branch}}-,format=short
            type=sha,prefix=sha-,format=long
            type=raw,value=latest

      - name: Build and push Web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          no-cache: ${{ inputs.force_rebuild == true }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Engine
        id: meta-engine
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.ENGINE_IMAGE }}
          tags: |
            type=sha,prefix={{branch}}-,format=short
            type=sha,prefix=sha-,format=long
            type=raw,value=latest

      - name: Build and push Engine image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./engine
          file: ./engine/Dockerfile
          push: true
          tags: ${{ steps.meta-engine.outputs.tags }}
          no-cache: ${{ inputs.force_rebuild == true }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runner self-hosted persistente: evita que crezcan imágenes huérfanas y caché de build.
      - name: Cleanup runner
        if: always()
        continue-on-error: true
        run: |
          docker image prune -f
          docker builder prune -f --filter "until=168h"

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment || 'production' }}
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER || vars.SERVER_USER }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY || vars.SERVER_SSH_KEY }}
        run: |
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || [ -z "$SERVER_SSH_KEY" ]; then
            echo "ERROR: SERVER_HOST, SERVER_USER, or SERVER_SSH_KEY is not set in the '$DEPLOY_ENVIRONMENT' environment."
            echo "Add them under Settings > Environments > $DEPLOY_ENVIRONMENT > Secrets (or Secrets > Actions for repo-level)."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          if ! ssh-keyscan -t ed25519 -T 15 -H -p 4422 "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "ssh-keyscan on port 4422 failed; disabling StrictHostKeyChecking for this host"
            cat >> ~/.ssh/config << SSHCONF
          Host $SERVER_HOST
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentityFile ~/.ssh/id_rsa
            LogLevel ERROR
          SSHCONF
          fi
          cat >> ~/.ssh/config << SSHCONF
          Host $SERVER_HOST
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 10m
          SSHCONF

      - name: Create deployment directory
        env:
          ENVIRONMENT: ${{ env.DEPLOY_ENVIRONMENT }}
        run: |
          echo "Testing SSH connection..."
          ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 -o BatchMode=yes -p 4422 "$SERVER_USER@$SERVER_HOST" "mkdir -p ~/svaes/$ENVIRONMENT"

      - name: Copy Docker Compose file
        env:
          ENVIRONMENT: ${{ env.DEPLOY_ENVIRONMENT }}
        run: |
          scp -P 4422 docker-compose.prod.yml "$SERVER_USER@$SERVER_HOST:~/svaes/$ENVIRONMENT/docker-compose.yml"

      - name: Copy nginx configuration
        env:
          ENVIRONMENT: ${{ env.DEPLOY_ENVIRONMENT }}
        run: |
          scp -P 4422 nginx.conf "$SERVER_USER@$SERVER_HOST:~/svaes/$ENVIRONMENT/" 2>/dev/null || true

      - name: Create .env file and copy to server
        env:
          ENVIRONMENT: ${{ env.DEPLOY_ENVIRONMENT }}
          REGISTRY: ${{ env.REGISTRY }}
          API_IMAGE: ${{ env.API_IMAGE }}
          WEB_IMAGE: ${{ env.WEB_IMAGE }}
          ENGINE_IMAGE: ${{ env.ENGINE_IMAGE }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || vars.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD || vars.REDIS_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || vars.JWT_SECRET_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || vars.ENCRYPTION_KEY }}
          ENGINE_API_KEY: ${{ secrets.ENGINE_API_KEY || vars.ENGINE_API_KEY }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS || vars.ALLOWED_ORIGINS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || vars.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || vars.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || vars.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM || vars.SMTP_FROM }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || vars.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || vars.ADMIN_PASSWORD }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL || vars.APP_BASE_URL }}
          API_KEY_PEPPER: ${{ secrets.API_KEY_PEPPER || vars.API_KEY_PEPPER }}
          FEEDBACK_SYNC_KEY: ${{ secrets.FEEDBACK_SYNC_KEY || vars.FEEDBACK_SYNC_KEY }}
        run: |
          {
            printf 'REGISTRY=%s\n'               "$REGISTRY"
            printf 'API_IMAGE=%s\n'               "$API_IMAGE"
            printf 'WEB_IMAGE=%s\n'               "$WEB_IMAGE"
            printf 'ENGINE_IMAGE=%s\n'            "$ENGINE_IMAGE"
            printf 'SVAES_IMAGE_TAG=sha-%s\n'   "$GITHUB_SHA"
            printf 'POSTGRES_USER=%s\n'           "$POSTGRES_USER"
            printf 'POSTGRES_PASSWORD=%s\n'       "$POSTGRES_PASSWORD"
            printf 'REDIS_PASSWORD=%s\n'          "$REDIS_PASSWORD"
            printf 'JWT_SECRET_KEY=%s\n'          "$JWT_SECRET_KEY"
            printf 'ENCRYPTION_KEY=%s\n'          "$ENCRYPTION_KEY"
            printf 'ENGINE_API_KEY=%s\n'          "$ENGINE_API_KEY"
            printf 'ALLOWED_ORIGINS=%s\n'         "$ALLOWED_ORIGINS"
            printf 'SMTP_HOST=%s\n'               "$SMTP_HOST"
            printf 'SMTP_PORT=%s\n'               "$SMTP_PORT"
            printf 'SMTP_USER=%s\n'               "$SMTP_USER"
            printf 'SMTP_PASSWORD=%s\n'           "$SMTP_PASSWORD"
            printf 'SMTP_FROM=%s\n'               "$SMTP_FROM"
            printf 'ADMIN_EMAIL=%s\n'             "$ADMIN_EMAIL"
            printf 'ADMIN_PASSWORD=%s\n'          "$ADMIN_PASSWORD"
            printf 'APP_BASE_URL=%s\n'            "$APP_BASE_URL"
            printf 'API_KEY_PEPPER=%s\n'          "$API_KEY_PEPPER"
            printf 'FEEDBACK_SYNC_KEY=%s\n'       "$FEEDBACK_SYNC_KEY"
            printf 'JWT_EXPIRE_MINUTES=60\n'
            printf 'ENVIRONMENT=production\n'
          } > .env.prod
          scp -P 4422 .env.prod "$SERVER_USER@$SERVER_HOST:~/svaes/$ENVIRONMENT/.env"

      - name: Pull latest images
        env:
          ENVIRONMENT: ${{ env.DEPLOY_ENVIRONMENT }}
          REGISTRY: ${{ env.REGISTRY }}
          API_IMAGE: ${{ env.API_IMAGE }}
          WEB_IMAGE: ${{ env.WEB_IMAGE }}
          ENGINE_IMAGE: ${{ env.ENGINE_IMAGE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          # El token viaja por stdin (no aparece en la lista de procesos del servidor)
          # y se cierra la sesión del registro al terminar, falle o no el pull.
          printf '%s' "$GITHUB_TOKEN" | ssh -p 4422 "$SERVER_USER@$SERVER_HOST" "export REGISTRY='$REGISTRY' API_IMAGE='$API_IMAGE' WEB_IMAGE='$WEB_IMAGE' ENGINE_IMAGE='$ENGINE_IMAGE' && cd ~/svaes/$ENVIRONMENT && \
            docker login $REGISTRY -u '$GITHUB_ACTOR' --password-stdin && \
            { docker compose pull; rc=\$?; docker logout $REGISTRY; exit \$rc; }"

      - name: Run database migration
        if: github.event_name == 'push' || !inputs.skip_migration
        env:
          ENVIRONMENT: ${{ env.DEPLOY_ENVIRONMENT }}
        run: |
          ssh -p 4422 "$SERVER_USER@$SERVER_HOST" "cd ~/svaes/$ENVIRONMENT && \
            docker compose run --rm api python -m alembic upgrade head"

      - name: Clean SVAES data volumes
        if: github.event_name == 'workflow_dispatch' && inputs.clean_volumes
        env:
          ENVIRONMENT: ${{ env.DEPLOY_ENVIRONMENT }}
        run: |
          ssh -p 4422 "$SERVER_USER@$SERVER_HOST" "cd ~/svaes/$ENVIRONMENT && \
            docker compose down --volumes --remove-orphans 2>/dev/null && \
            echo 'SVAES data volumes (postgres_data, redis_data) deleted.'"

      - name: Restart services
        env:
          ENVIRONMENT: ${{ env.DEPLOY_ENVIRONMENT }}
        run: |
          ssh -p 4422 "$SERVER_USER@$SERVER_HOST" "cd ~/svaes/$ENVIRONMENT && \
            docker compose down --remove-orphans 2>/dev/null; \
            sleep 3; docker compose up -d"

      - name: Health check
        env:
          ENVIRONMENT: ${{ env.DEPLOY_ENVIRONMENT }}
        run: |
          ssh -p 4422 "$SERVER_USER@$SERVER_HOST" " \
            healthy=false; \
            for i in \$(seq 1 30); do \
              if curl -sf http://localhost:8000/health > /dev/null 2>&1; then \
                echo 'API is healthy'; healthy=true; break; \
              fi; \
              echo 'Waiting for API...'; sleep 2; \
            done; \
            if [ \"\$healthy\" != \"true\" ]; then \
              echo 'ERROR: API did not become healthy. Showing API container logs (last 50 lines):'; \
              cd ~/svaes/$ENVIRONMENT && docker compose logs --tail=50 api 2>&1; \
              echo '---'; \
              exit 1; \
            fi && \
            for i in \$(seq 1 10); do \
              if curl -sf http://localhost:8880/ > /dev/null 2>&1; then \
                echo 'Web is healthy'; break; \
              fi; \
              echo 'Waiting for Web...'; sleep 2; \
            done"

      - name: Show container status
        env:
          ENVIRONMENT: ${{ env.DEPLOY_ENVIRONMENT }}
        run: |
          ssh -p 4422 "$SERVER_USER@$SERVER_HOST" "cd ~/svaes/$ENVIRONMENT && docker compose ps"

      # Limpieza: siempre, aunque el despliegue falle.
      - name: Cleanup (runner and server)
        if: always()
        continue-on-error: true
        env:
          ENVIRONMENT: ${{ env.DEPLOY_ENVIRONMENT }}
        run: |
          # Servidor: imágenes sin usar de más de 7 días (las en uso nunca se eliminan)
          if [ -n "$SERVER_HOST" ] && [ -n "$SERVER_USER" ]; then
            ssh -o ConnectTimeout=15 -o BatchMode=yes -p 4422 "$SERVER_USER@$SERVER_HOST" \
              "docker image prune -af --filter 'until=168h' && docker builder prune -f --filter 'until=168h'" || true
            ssh -O exit -p 4422 "$SERVER_USER@$SERVER_HOST" 2>/dev/null || true
          fi
          # Runner: secretos en disco
          rm -f .env.prod ~/.ssh/id_rsa ~/.ssh/config ~/.ssh/known_hosts
          rm -f ~/.ssh/cm-* 2>/dev/null || true
