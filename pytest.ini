[pytest]
asyncio_mode = auto
filterwarnings =
    ignore:The engine provided as bind produced a connection that is already in a transaction.*:sqlalchemy.exc.SAWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning
testpaths =
    tests/unit
    tests/integration
    tests/security
    tests/performance
pythonpath = api/src
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: integration tests requiring database
    unit: unit tests with mocked dependencies
    security: security-focused tests
    performance: performance and coverage threshold tests
    e2e: end-to-end acceptance tests
