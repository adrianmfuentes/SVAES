[project]
name = "svaes-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "alembic>=1.20.1",
    "sqlalchemy[asyncio]>=2.1.9",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<5.1.0",
    "PyJWT>=2.15.1",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "pydantic-settings>=2.16.2",
    "slowapi>=0.1.10",
    "celery>=5.7.0",
    "redis>=8.1.0",
    "httpx>=0.28.1",
    "reportlab>=5.1.0",
    "asyncpg>=0.32.0",
    "pyotp>=2.10.0",
    "segno>=1.6.6",
    "starlette>=1.10.0",
    "croniter>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=1.5.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "pytest-mock",
    "factory-boy",
    "faker",
    "testcontainers",
    "locust>=2.47.0",
    "aiosqlite>=0.22.1",
    "respx>=0.23.1",
    "import-linter>=2.9",
]

[tool.importlinter]
root_packages = ["features", "shared", "bootstrap"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "El dominio no depende de capas externas"
type = "forbidden"
source_modules = ["features.*.domain", "shared.domain"]
forbidden_modules = [
    "bootstrap", "features.*.application",
    "features.*.infrastructure", "shared.application", "shared.infrastructure",
    "fastapi", "sqlalchemy",
]

[[tool.importlinter.contracts]]
name = "La aplicación accede a la infraestructura mediante puertos"
type = "forbidden"
source_modules = ["features.*.application", "shared.application"]
forbidden_modules = [
    "bootstrap", "features.*.infrastructure", "shared.infrastructure",
    "fastapi", "sqlalchemy", "httpx", "cryptography", "pyotp", "segno", "reportlab", "croniter",
]
allow_indirect_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:The engine provided as bind produced a connection that is already in a transaction.*:sqlalchemy.exc.SAWarning",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "respx>=0.23.1",
]

[tool.coverage.run]
omit = [
    "src/main.py",
    "src/bootstrap/application.py",
    "src/shared/infrastructure/config.py",
    "src/__init__.py",
    "src/features/*/application/ports/**",
    "src/shared/application/**",
    "src/features/verification/infrastructure/workers/verification_worker.py",
    "src/shared/infrastructure/database/models/__init__.py",
    "src/features/connectors/infrastructure/gateways/task_management/__init__.py",
    "src/features/connectors/infrastructure/gateways/source_control/__init__.py",
    "src/features/connectors/infrastructure/gateways/documentation/__init__.py",
    "src/features/connectors/infrastructure/gateways/planning/__init__.py",
    "src/features/connectors/infrastructure/gateways/change_management/__init__.py",
    "src/shared/infrastructure/queue/__init__.py",
    "src/shared/infrastructure/queue/celery_app.py",
    "src/features/verification/infrastructure/workers/__init__.py",
    "*/alembic/versions/*",
    "*/alembic/env.py",
    "*/migrations/*",
    "src/svaes_api.egg-info/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
