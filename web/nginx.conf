server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Behind a TLS proxy: never emit redirects with the internal http/:8080 origin.
    absolute_redirect off;

    # Compress text assets (nginx ships with gzip off).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/xml image/svg+xml application/manifest+json;

    # Hashed build output never changes: cache for a year.
    location ~* \.(?:js|css|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Images, icons and the site manifest: long but revalidatable.
    location ~* \.(?:svg|png|jpg|jpeg|webp|avif|ico|json|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        # Serve prerendered <route>/index.html directly (no 301 to trailing slash).
        # HTML is always revalidated so a new deploy is picked up at once.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /index.html;
    }

    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        send_timeout 60s;
    }
}
